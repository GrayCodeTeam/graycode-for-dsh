# CI for the GrayCode × DeepSeek Harness monorepo
#
# Design (see docs/CI.md for the full rationale):
#   - `full`   : ubuntu-latest — every gate: typecheck, full unit suite, build,
#                pack, tarball content check, clean-profile install smoke (dsh CLI).
#   - `smoke`  : windows-latest + macos-latest — typecheck, a core test subset,
#                build, pack and the same tarball content check (packaging is
#                platform-sensitive: path separators, LICENSE inclusion, tar).
#
# Toolchain pinning: Node 22.x (resolves to the latest 22, satisfying the
# ^22.19 || >=24 requirement of docs/ADR-0001) and pnpm 11.7.0
# (root packageManager field).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '11.7.0'

jobs:
  full:
    name: Full (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Caches the pnpm content-addressable store, keyed on the lockfile.
          cache: pnpm

      - name: Cache node_modules
        # pnpm resolves the full graph from the store; node_modules caching saves
        # the linking step. Keyed on the lockfile hash as required. Note: on
        # Windows, pnpm node_modules contains junctions — if cache restore ever
        # proves flaky there, drop this step on windows-latest (store cache
        # alone still makes installs fast) rather than deleting the lockfile.
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (full suite)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack
        # NOTE: must be `pnpm run pack` (the npm script), not bare `pnpm pack`
        # (the pnpm builtin), which at the workspace root packs the PRIVATE root
        # package - the whole repo - into graycode-dsh-<version>.tgz.
        run: pnpm run pack

      - name: Verify tarball contents
        # Reuses the local verification script; CI already built and packed, so
        # only the inspection part runs. pwsh is preinstalled on all runners.
        shell: pwsh
        run: ./scripts/verify-pack.ps1 -SkipBuild -SkipPack

      - name: Clean-profile install smoke (dsh CLI)
        # Non-blocking on purpose — see the "why" inside the script:
        #   1. `@deepseek-ai/dsh@0.1.0-rc.6` is pinned like every other DSH dep
        #      (ADR-0001), but dsh is not preinstalled on runners, so we npm -g it.
        #   2. The bundle tarball declares `@graycode/dsh-plugin@^0.1.0`, which
        #      must resolve from the npm registry. Until the @graycode/* packages
        #      are published this fails with ERR_PNPM_FETCH_404 — exactly what
        #      this gate exists to catch. The step prints the failure loudly and
        #      uploads the logs as an artifact (step below), so it is visible in
        #      every PR, not silently swallowed.
        #   3. The plugin tarball alone installs today (all its deps are
        #      published rc.6) and its `--dump-config` still gets asserted.
        #   Flip continue-on-error to false once the packages are published.
        continue-on-error: true
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          set -u
          echo "::group::dsh clean-profile install smoke"
          npm install --global @deepseek-ai/dsh@0.1.0-rc.6 >/dev/null 2>&1
          dsh --version
          rm -rf "$DSH_HOME"
          mkdir -p "$DSH_HOME"

          PLUGIN_TGZ=$(ls graycode-dsh-plugin-*.tgz 2>/dev/null | head -n1)
          BUNDLE_TGZ=$(ls graycode-dsh-*.tgz 2>/dev/null | grep -v dsh-plugin | head -n1)
          echo "plugin tarball: $PLUGIN_TGZ"
          echo "bundle tarball: $BUNDLE_TGZ"

          # 1) plugin tarball — must install into a fresh profile today
          dsh plugin --profile graycode add "./$PLUGIN_TGZ" >dsh-smoke-plugin.log 2>&1
          echo "plugin install exit: $?"
          tail -n 5 dsh-smoke-plugin.log

          # 2) bundle tarball — fails with 404 until @graycode/* is published
          dsh plugin --profile graycode add "./$BUNDLE_TGZ" >dsh-smoke-bundle.log 2>&1
          echo "bundle install exit: $?"
          tail -n 5 dsh-smoke-bundle.log

          # 3) dump-config + assert the Gray layer
          #    The bundle patch (cordis.patch.yml) inserts `id: graycode` with
          #    name '@graycode/dsh-plugin' — "仅增 Gray 行".
          dsh --profile graycode --dump-config >dsh-smoke-dump-config.log 2>&1
          echo "dump-config exit: $?"
          if grep -q "id: graycode" dsh-smoke-dump-config.log \
             && grep -q "@graycode/dsh-plugin" dsh-smoke-dump-config.log; then
            echo "GRAY_LAYER=present"
          else
            echo "GRAY_LAYER=missing"
          fi
          echo "::endgroup::"

      - name: Upload dsh smoke diagnostics
        # Collect logs even when the step above failed (or was skipped), so the
        # 404/publish-gate condition stays visible in the run's artifacts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-smoke-${{ runner.os }}-${{ github.run_id }}
          path: dsh-smoke-*.log
          if-no-files-found: ignore

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (core subset)
        # Windows/macOS run the smoke subset; Linux runs the full suite.
        run: pnpm test:smoke

      - name: Build
        run: pnpm build

      - name: Pack
        # NOTE: must be `pnpm run pack` (the npm script), not bare `pnpm pack`
        # (the pnpm builtin), which at the workspace root packs the PRIVATE root
        # package - the whole repo - into graycode-dsh-<version>.tgz.
        run: pnpm run pack

      - name: Verify tarball contents
        shell: pwsh
        run: ./scripts/verify-pack.ps1 -SkipBuild -SkipPack
